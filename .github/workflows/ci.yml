name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hh
          POSTGRES_PASSWORD: hh
          POSTGRES_DB: hh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hh"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://hh:hh@localhost:5432/hh_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:reset
      - run: npm test
      - run: npm run test:tz
      # Same gate as scripts/check.sh. Makes and drops hh_validate_test on the service (hh is superuser).
      - run: npm run db:validate
