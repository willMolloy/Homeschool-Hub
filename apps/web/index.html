<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF6EE" />
    <meta name="color-scheme" content="light dark" />
    <!-- S8-02: apply the saved theme and paint the page colour before the stylesheet loads, so dark mode never flashes white. Key: src/lib/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem("hh.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <style>
      html { background: #FAF6EE; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #1C1A17; } }
      html[data-theme="dark"] { background: #1C1A17; }
    </style>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Homeschool" />
    <title>Homeschool Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
